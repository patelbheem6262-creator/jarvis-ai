<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>JARVIS AI</title>

<style>
* { box-sizing: border-box; }
  
body {
  margin: 0;
  padding: 22px;
  background: #050914;
  color: #00eaff;
  font-family: Arial, sans-serif;
  text-align: center;
}

h1 {
  letter-spacing: 6px;
  text-shadow: 0 0 18px #00eaff;
}

.orb {
  width: 175px;
  height: 175px;
  margin: 35px auto;
  border: 4px solid #00eaff;
  border-radius: 50%;
  display: grid;
  place-items: center;
  box-shadow: 0 0 28px #00eaff,
              inset 0 0 22px #00eaff;
  animation: pulse 2s infinite alternate;
}

.core {
  width: 75px;
  height: 75px;
  background: #00eaff;
  border-radius: 50%;
  box-shadow: 0 0 30px #00eaff;
}

@keyframes pulse {
  to { transform: scale(1.05); }
}

#status {
  color: white;
  min-height: 25px;
  margin: 15px;
}

button {
  background: #0b1b2c;
  border: 1px solid #00eaff;
  color: #00eaff;
  padding: 13px 16px;
  border-radius: 9px;
  margin: 5px;
  font-size: 15px;
}

input {
  width: 95%;
  margin-top: 18px;
  padding: 14px;
  border-radius: 9px;
  border: 1px solid #00eaff;
  background: #101c30;
  color: white;
  font-size: 16px;
}

#reply {
  background: #101c30;
  color: white;
  padding: 16px;
  margin-top: 20px;
  border-radius: 10px;
  text-align: left;
  min-height: 55px;
}
</style>
</head>

<body>

<h1>JARVIS</h1>
<p>PERSONAL AI ASSISTANT</p>

<div class="orb"><div class="core"></div></div>

<div id="status">System Ready</div>

<button onclick="testVoice()">🔊 Test Voice</button>
<button onclick="startListening()">🎤 Speak</button>
<button onclick="stopSpeaking()">⏹ Stop</button>

<br>

<input id="message" placeholder="Type in Hindi or English">

<button onclick="sendMessage()">Send</button>

<div id="reply">Jarvis: नमस्ते! सिस्टम तैयार है।</div>

<script>
const statusBox = document.getElementById("status");
const replyBox = document.getElementById("reply");
const inputBox = document.getElementById("message");

let voices = [];
let recognition;

function loadVoices() {
  if ("speechSynthesis" in window) {
    voices = window.speechSynthesis.getVoices();
  }
}

if ("speechSynthesis" in window) {
  loadVoices();
  window.speechSynthesis.onvoiceschanged = loadVoices;
}

// Choose a suitable available voice.
// Voice names do not reliably indicate gender.
function chooseVoice(language) {
  loadVoices();

  const available = voices.filter(v =>
    v.lang.toLowerCase().startsWith(
      language === "hi-IN" ? "hi" : "en"
    )
  );

  if (language === "hi-IN") {
    return available[0] || null;
  }

  return available.find(v =>
    /david|daniel|george|mark|james|guy/i.test(v.name)
  ) || available.find(v =>
    /en-gb/i.test(v.lang)
  ) || available[0] || null;
}

// Deep, calm speaking style
function speak(text, language = "hi-IN") {
  if (!("speechSynthesis" in window)) {
    statusBox.innerText = "Speech is not supported in this browser.";
    return;
  }

  window.speechSynthesis.cancel();

  const utterance = new SpeechSynthesisUtterance(text);
  utterance.lang = language;

  // Lower pitch and slower pace for a deeper effect
  utterance.rate = 0.84;
  utterance.pitch = 0.65;
  utterance.volume = 1;

  const voice = chooseVoice(language);
  if (voice) utterance.voice = voice;

  utterance.onstart = () => {
    statusBox.innerText = "Jarvis is speaking...";
  };

  utterance.onend = () => {
    statusBox.innerText = "System Ready";
  };

  utterance.onerror = (event) => {
    statusBox.innerText = "Voice error: " + event.error;
  };

  window.speechSynthesis.speak(utterance);
}

function showReply(text, language = "hi-IN") {
  replyBox.innerText = "Jarvis: " + text;
  speak(text, language);
}

function testVoice() {
  showReply(
    "नमस्ते। मैं जार्विस हूँ। आपका सिस्टम तैयार है।",
    "hi-IN"
  );
}

function sendMessage() {
  const text = inputBox.value.trim();
  if (!text) return;

  const lower = text.toLowerCase();
  let answer;
  let language = "hi-IN";

  if (lower.includes("hello") ||
      lower.includes("hi") ||
      lower.includes("your name")) {
    answer = "Hello. I am Jarvis, your personal assistant.";
    language = "en-US";
  } else if (lower.includes("time") ||
             lower.includes("समय")) {
    answer = "अभी समय है " +
      new Date().toLocaleTimeString("hi-IN");
  } else if (lower.includes("date") ||
             lower.includes("तारीख")) {
    answer = "आज की तारीख है " +
      new Date().toLocaleDateString("hi-IN");
  } else if (lower.includes("kaise ho") ||
             lower.includes("कैसे हो")) {
    answer = "मैं ठीक हूँ। बताइए, मैं आपकी क्या मदद करूँ?";
  } else if (lower.includes("who are you") ||
             lower.includes("तुम कौन")) {
    answer = "मैं Jarvis हूँ, आपका पर्सनल असिस्टेंट।";
  } else {
    answer = "मैं अभी डेमो मोड में हूँ। असली AI से जुड़ने के बाद मैं और सवालों के जवाब दे सकूँगा।";
  }

  inputBox.value = "";
  showReply(answer, language);
}

function startListening() {
  const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;

  if (!SpeechRecognition) {
    statusBox.innerText =
      "Mic recognition unavailable. Try Chrome.";
    return;
  }

  recognition = new SpeechRecognition();
  recognition.lang = "hi-IN";
  recognition.continuous = false;
  recognition.interimResults = false;

  recognition.onstart = () => {
    statusBox.innerText = "Listening...";
  };

  recognition.onresult = (event) => {
    inputBox.value = event.results[0][0].transcript;
    sendMessage();
  };

  recognition.onerror = (event) => {
    statusBox.innerText = "Mic error: " + event.error;
  };

  recognition.start();
}

function stopSpeaking() {
  if ("speechSynthesis" in window) {
    window.speechSynthesis.cancel();
  }
  if (recognition) {
    recognition.stop();
  }
  statusBox.innerText = "Stopped";
}
</script>
<button onclick="loginWithGoogle()">
  Login with Google
</button>
</body>
</html>
